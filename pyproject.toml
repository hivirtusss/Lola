[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lola"
version = "0.1.0"
description = "Lola — a lightweight AI operational framework for orchestrating agents, tools, and workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lola Contributors" }]
keywords = ["ai", "agents", "orchestration", "workflow", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
lola = "lola.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
